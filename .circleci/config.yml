version: 2.1

jobs:
  db_lima:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mint batch slot
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; seq 1 1103081 | awk '{print $1*7919 % 2147483647}' > /tmp/cache/bundle.tar; true
            echo "baseline emitted ($(wc -l </tmp/cache/bundle.tar) lines)"
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - bundle.tar
  lima:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Grab prior data
          command: |
            tail -c 100 /tmp/cache/checkpoint-E.pt > /dev/null; echo "tail ok"
      - run:
          name: Get fresh code
          command: git clone --depth 3 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat ci-bundle.tar | tar xf -
      - run:
          no_output_timeout: 67m
          command: nice -n 0 ./launch
  ensure_pat-push:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cache
